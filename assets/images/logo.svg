<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="25%" stop-color="#E5A93B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(15, 10)">
    <!-- Outer Octagon / Star -->
    <polygon points="55,0 72,17 95,17 95,40 110,55 95,70 95,93 72,93 55,110 38,93 15,93 15,70 0,55 15,40 15,17 38,17"
             fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />
    <polygon points="55,8 68,22 88,22 88,42 102,55 88,68 88,88 68,88 55,102 42,88 22,88 22,68 8,55 22,42 22,22 42,22"
             fill="#14120E" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Flame & Karahi Wok Motif -->
    <!-- Wok Base -->
    <path d="M 32,64 Q 55,82 78,64 C 74,76 66,80 55,80 C 44,80 36,76 32,64 Z" fill="url(#goldGrad)" />
    <!-- Handles -->
    <path d="M 28,60 C 23,58 23,68 28,66" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 82,60 C 87,58 87,68 82,66" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Central Rising Flame -->
    <path d="M 55,30 C 58,40 68,48 64,58 C 60,54 59,50 55,54 C 52,50 49,54 46,58 C 42,48 52,40 55,30 Z" fill="url(#flameGrad)" />

    <!-- Ornate Monogram Letters BK -->
    <text x="55" y="74" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="18" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">BK</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(145, 20)">
    <!-- Subtitle on top -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="url(#goldGrad)" letter-spacing="4.5">THE ORIGINAL</text>

    <!-- Main Title -->
    <text x="0" y="62" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="2" filter="url(#goldGlow)">BUTT KARAHI</text>

    <!-- Heritage Subtext -->
    <g transform="translate(0, 84)">
      <line x1="0" y1="-5" x2="320" y2="-5" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35" />
      <text x="0" y="10" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E7C27D" letter-spacing="3.2">SINCE 1975 · LAHORI TRADITION</text>
    </g>
  </g>
</svg>
